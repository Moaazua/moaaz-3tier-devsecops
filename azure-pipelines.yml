trigger:
  branches:
    include:
      - feature/ci-cd
      - develop
      - main  

pool:
  vmImage: ubuntu-latest
#########################################
#------Stage 1 - Application Tests------#
#########################################
stages:
  - stage: Test
    displayName: Stage 1 - Application Tests

    jobs:
      - job: BackendTests
        displayName: Backend Tests

        steps:
          - checkout: self

          - task: UsePythonVersion@0
            displayName: Setup Python
            inputs:
              versionSpec: '3.12'

          - script: |
              python -m pip install --upgrade pip
              pip install -r src/note_backend/requirements.txt
              pip install pytest
            displayName: Install Backend Dependencies

          - script: |
              export PYTHONPATH="$(Build.SourcesDirectory):$PYTHONPATH"

              pytest tests/ \
                --junitxml=$(Common.TestResultsDirectory)/pytest-results.xml
            displayName: Run Backend Tests

          - task: PublishTestResults@2
            displayName: Publish Backend Test Results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Common.TestResultsDirectory)/pytest-results.xml'
              testRunTitle: Backend Pytest Results

      - job: FrontendBuildCheck
        displayName: Frontend Build Check

        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Setup Node.js
            inputs:
              version: '24.x'

          - script: |
              npm ci --legacy-peer-deps
              npm run build
            workingDirectory: src/note_frontend
            displayName: Build Frontend
#########################################
#------Stage 2 - Security Scan----------#
#########################################
  - stage: Security
    displayName: Stage 2 - Trivy Security Scan
    dependsOn: Test
    condition: succeeded()

    jobs:
      - job: TrivyScan
        displayName: Trivy Security Scan

        steps:
          - checkout: self

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                | sudo sh -s -- -b /usr/local/bin v0.74.0

              trivy --version
            displayName: Install Trivy

          - script: |
              trivy fs \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignorefile .trivyignore.yaml \
                --exit-code 1 \
                .
            displayName: Vulnerability Security Gate

          - script: |
              trivy fs \
                --scanners secret \
                --exit-code 1 \
                .
            displayName: Secret Security Gate

          - script: |
              trivy fs \
                --scanners misconfig \
                --severity HIGH,CRITICAL \
                --exit-code 0 \
                .
            displayName: IaC Misconfiguration Scan
#########################################
#------Stage 3 - Docker Build-----------#
#########################################
  - stage: Build
    displayName: Stage 3 - Docker Build
    dependsOn: Security
    condition: succeeded()

    jobs:

      # Backend Image
      - job: BackendBuild
        displayName: Build Backend Image

        steps:
          - checkout: self

          - script: |
              docker build \
                -t note-backend:$(Build.BuildId) \
                src/note_backend
            displayName: Build Backend Docker Image

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/backend

              docker save \
                note-backend:$(Build.BuildId) \
                -o $(Build.ArtifactStagingDirectory)/backend/backend-image.tar
            displayName: Export Backend Docker Image

          - task: PublishPipelineArtifact@1
            displayName: Publish Backend Image Artifact
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend'
              artifact: 'backend-image'
              publishLocation: 'pipeline'


      # Frontend Image
      - job: FrontendBuild
        displayName: Build Frontend Image

        steps:
          - checkout: self

          - script: |
              docker build \
                -t note-frontend:$(Build.BuildId) \
                src/note_frontend
            displayName: Build Frontend Docker Image

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/frontend

              docker save \
                note-frontend:$(Build.BuildId) \
                -o $(Build.ArtifactStagingDirectory)/frontend/frontend-image.tar
            displayName: Export Frontend Docker Image

          - task: PublishPipelineArtifact@1
            displayName: Publish Frontend Image Artifact
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/frontend'
              artifact: 'frontend-image'
              publishLocation: 'pipeline'

#########################################
#------Stage 4 - Trivy Image Scan-------#
#########################################
  - stage: ImageSecurity
    displayName: Stage 4 - Trivy Image Scan
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: ImageScan
        displayName: Scan Docker Images

        steps:
          - checkout: none

          # Download Backend Artifact
          - task: DownloadPipelineArtifact@2
            displayName: Download Backend Image
            inputs:
              buildType: current
              artifactName: backend-image
              targetPath: '$(Pipeline.Workspace)/backend-image'

          # Download Frontend Artifact
          - task: DownloadPipelineArtifact@2
            displayName: Download Frontend Image
            inputs:
              buildType: current
              artifactName: frontend-image
              targetPath: '$(Pipeline.Workspace)/frontend-image'

          # Restore Docker Images
          - script: |
              docker load \
                -i $(Pipeline.Workspace)/backend-image/backend-image.tar

              docker load \
                -i $(Pipeline.Workspace)/frontend-image/frontend-image.tar

              docker images
            displayName: Load Docker Images

          # Install Trivy
          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                | sudo sh -s -- -b /usr/local/bin v0.74.0

              trivy --version
            displayName: Install Trivy


          #####################################
          # Backend Image Scan
          #####################################

          - script: |
              echo "=========================================="
              echo "Backend - Full Vulnerability Report"
              echo "=========================================="

              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 0 \
                note-backend:$(Build.BuildId)

              echo ""
              echo "=========================================="
              echo "Backend - Fixable Vulnerability Gate"
              echo "=========================================="

              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                note-backend:$(Build.BuildId)
            displayName: Scan Backend Image


          #####################################
          # Frontend Image Scan
          #####################################

          - script: |
              echo "=========================================="
              echo "Frontend - Full Vulnerability Report"
              echo "=========================================="

              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 0 \
                note-frontend:$(Build.BuildId)

              echo ""
              echo "=========================================="
              echo "Frontend - Fixable Vulnerability Gate"
              echo "=========================================="

              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                note-frontend:$(Build.BuildId)
            displayName: Scan Frontend Image
#########################################
#------Stage 5 - Push Images to ECR-----#
#########################################
  - stage: PushECR
    displayName: Stage 5 - Push Images to AWS ECR
    dependsOn: ImageSecurity
    condition: succeeded()

    jobs:
      - job: PushImages
        displayName: Push Docker Images to ECR

        steps:
          - checkout: none

          # Download Backend Artifact
          - task: DownloadPipelineArtifact@2
            displayName: Download Backend Image
            inputs:
              buildType: current
              artifactName: backend-image
              targetPath: '$(Pipeline.Workspace)/backend-image'

          # Download Frontend Artifact
          - task: DownloadPipelineArtifact@2
            displayName: Download Frontend Image
            inputs:
              buildType: current
              artifactName: frontend-image
              targetPath: '$(Pipeline.Workspace)/frontend-image'

          # Restore same images built in Stage 3
          - script: |
              docker load \
                -i $(Pipeline.Workspace)/backend-image/backend-image.tar

              docker load \
                -i $(Pipeline.Workspace)/frontend-image/frontend-image.tar

              docker images
            displayName: Load Docker Images

          # Authenticate and push to ECR
          - task: AWSShellScript@1
            displayName: Authenticate and Push Images to ECR
            inputs:
              awsCredentials: 'aws-ecr-oidc'
              regionName: 'eu-central-1'
              scriptType: 'inline'
              inlineScript: |
                set -e

                REGISTRY="622813843858.dkr.ecr.eu-central-1.amazonaws.com"

                BACKEND_REPO="$REGISTRY/moaaz-3tier-devsecops-dev-backend"
                FRONTEND_REPO="$REGISTRY/moaaz-3tier-devsecops-dev-frontend"

                IMAGE_TAG="$(Build.BuildId)"

                echo "Verifying AWS identity..."
                aws sts get-caller-identity

                echo "Logging in to Amazon ECR..."
                aws ecr get-login-password \
                  --region eu-central-1 \
                  | docker login \
                      --username AWS \
                      --password-stdin "$REGISTRY"

                echo "Tagging backend image..."
                docker tag \
                  note-backend:$IMAGE_TAG \
                  $BACKEND_REPO:$IMAGE_TAG

                echo "Tagging frontend image..."
                docker tag \
                  note-frontend:$IMAGE_TAG \
                  $FRONTEND_REPO:$IMAGE_TAG

                echo "Pushing backend image..."
                docker push $BACKEND_REPO:$IMAGE_TAG

                echo "Pushing frontend image..."
                docker push $FRONTEND_REPO:$IMAGE_TAG

                echo "Images pushed successfully."
                echo "Backend: $BACKEND_REPO:$IMAGE_TAG"
                echo "Frontend: $FRONTEND_REPO:$IMAGE_TAG"

#########################################
#------Stage 6 - Deploy to AWS EKS------#
#########################################
  - stage: DeployEKS
    displayName: Stage 6 - Deploy to AWS EKS
    dependsOn: PushECR
    condition: succeeded()

    jobs:
      - job: DeployToEKS
        displayName: Deploy Application to EKS

        # Stage 6 only runs on the Rocky Linux self-hosted agent pool
        pool:
          name: eks-deploy-pool

        steps:
          - checkout: self

          # Fail early with a clear message if the deployment agent is missing a required tool
          - script: |
              set -e

              echo "Agent name: $(Agent.Name)"
              echo "Agent OS: $(Agent.OS)"

              for tool in aws kubectl helm; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "ERROR: $tool is not installed or not available in PATH."
                  exit 1
                fi
              done

              aws --version
              kubectl version --client
              helm version
            displayName: Verify Deployment Agent Tools

          # Use the AWS service connection, connect kubectl to EKS, then deploy with Helm
          - task: AWSShellScript@1
            displayName: Deploy Helm Release to EKS
            inputs:
              awsCredentials: 'aws-ecr-oidc'
              regionName: 'eu-central-1'
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail

                CLUSTER_NAME="moaaz-3tier-devsecops-dev-eks"
                NAMESPACE="note-app"
                RELEASE_NAME="note-app"
                IMAGE_TAG="$(Build.BuildId)"
                KUBECONFIG_FILE="$(Agent.TempDirectory)/kubeconfig"

                echo "Verifying AWS identity..."
                aws sts get-caller-identity

                echo "Configuring kubectl for EKS..."
                export KUBECONFIG="$KUBECONFIG_FILE"
                aws eks update-kubeconfig \
                  --region eu-central-1 \
                  --name "$CLUSTER_NAME" \
                  --kubeconfig "$KUBECONFIG"

                echo "Verifying EKS connectivity..."
                kubectl cluster-info
                kubectl get nodes -o wide

                echo "Validating Helm chart..."
                helm lint helm-chart \
                  --set backend.image.tag="$IMAGE_TAG" \
                  --set frontend.image.tag="$IMAGE_TAG" \
                  --set-string postgres.auth.password="$POSTGRES_PASSWORD"

                echo "Deploying application to EKS..."
                helm upgrade --install "$RELEASE_NAME" helm-chart \
                  --namespace "$NAMESPACE" \
                  --create-namespace \
                  --set backend.image.tag="$IMAGE_TAG" \
                  --set frontend.image.tag="$IMAGE_TAG" \
                  --set-string postgres.auth.password="$POSTGRES_PASSWORD" \
                  --atomic \
                  --wait-for-jobs \
                  --timeout 10m

                echo "Helm deployment completed successfully."
            env:
              POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)

          # Verify the resources created by the Helm release
          - task: AWSShellScript@1
            displayName: Verify EKS Deployment
            inputs:
              awsCredentials: 'aws-ecr-oidc'
              regionName: 'eu-central-1'
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail

                CLUSTER_NAME="moaaz-3tier-devsecops-dev-eks"
                NAMESPACE="note-app"
                KUBECONFIG_FILE="$(Agent.TempDirectory)/kubeconfig"

                export KUBECONFIG="$KUBECONFIG_FILE"

                # Recreate kubeconfig in case this task runs in a fresh shell context
                aws eks update-kubeconfig \
                  --region eu-central-1 \
                  --name "$CLUSTER_NAME" \
                  --kubeconfig "$KUBECONFIG"

                echo "Checking rollout status..."
                kubectl rollout status statefulset/postgres \
                  -n "$NAMESPACE" \
                  --timeout=5m

                kubectl rollout status deployment/backend \
                  -n "$NAMESPACE" \
                  --timeout=5m

                kubectl rollout status deployment/frontend \
                  -n "$NAMESPACE" \
                  --timeout=5m

                echo "Current Kubernetes resources:"
                kubectl get pods,svc,ingress,pvc \
                  -n "$NAMESPACE" \
                  -o wide

                echo "Stage 6 deployment verification completed successfully."
                