apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: slack-alerts
  namespace: monitoring
  labels:
    alertconfig: slack
spec:
  route:
    receiver: slack-notifications
    matchers:
      - name: project
        value: note-app
        matchType: "="
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h

  receivers:
    - name: slack-notifications
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: url
          sendResolved: true

          title: >-
            {{ .Status }}: {{ .CommonLabels.alertname }}

          text: >-
            {{ range .Alerts }}
            *Severity:* {{ .Labels.severity }}
            *Namespace:* {{ .Labels.namespace }}
            *Summary:* {{ .Annotations.summary }}
            {{ end }}
